<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cartaz QR-Code · Gala 50 Anos</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    .poster { max-width: 560px; margin: 2rem auto; text-align: center; padding: 3rem 2rem; border: 1px solid var(--gold); border-radius: 22px; background: var(--ink-2); position: relative; }
    .poster::before { content: ""; position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 16px; pointer-events: none; }
    .poster .n { font-family: var(--serif); font-size: 7rem; line-height: .85; margin: 0; }
    .poster h1 { font-family: var(--serif); font-weight: 500; font-size: 2.3rem; line-height: 1.1; margin: .6rem 0 1.5rem; }
    .poster .code { width: 300px; max-width: 100%; margin: 0 auto; background: #fff; padding: 14px; border-radius: 14px; }
    .poster p { color: var(--muted); margin: 1.5rem 0 .3rem; }
    .poster .url { color: var(--gold-2); font-weight: 600; word-break: break-all; }
    .print { text-align: center; margin-bottom: 3rem; }
    @media print {
      body { background: #fff; color: #111; }
      body::before, .print { display: none; }
      .poster { border-color: #b08b45; background: #fff; margin: 0 auto; }
      .poster p { color: #444; }
      .poster .url { color: #8a6a2c; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <p class="eyebrow">Gala · Meio século</p>
    <p class="n gold-text">50</p>
    <h1>Escola Professor<br />Reynaldo dos Santos</h1>
    <img class="code" src="/qr.svg" alt="QR-Code para enviar fotografias" />
    <p><strong style="color:inherit">Partilhe as fotografias da noite.</strong><br />Aponte a câmara do telemóvel ao código.</p>
    <div class="url" id="url"></div>
  </div>
  <div class="print"><button class="btn" onclick="print()">Imprimir cartaz</button> <a class="btn ghost" href="/qr.svg" download="qr-gala-50-anos.svg">Descarregar QR-Code</a></div>
  <script>document.getElementById("url").textContent = location.host + "/enviar";</script>
</body>
</html>
