<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apresentação ao vivo · Gala 50 Anos</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { overflow: hidden; background: #000; cursor: none; }
    body.ui { cursor: default; }
    .stage { position: fixed; inset: 0; }
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.4s ease; }
    .slide.show { opacity: 1; }
    .slide .bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(40px) brightness(.45); }
    .slide img {
      position: absolute; inset: 0; margin: auto; max-width: 100%; max-height: 100%; object-fit: contain;
      box-shadow: 0 30px 90px rgba(0,0,0,.6);
    }
    .slide.show img { animation: drift 9s ease-out forwards; }
    @keyframes drift { from { transform: scale(1); } to { transform: scale(1.045); } }

    .overlay { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 2rem;
      padding: 2rem 2.5rem; background: linear-gradient(transparent, rgba(0,0,0,.75)); pointer-events: none; }
    .title { display: flex; align-items: center; gap: 1.1rem; }
    .title .n { font-family: var(--serif); font-size: 4.2rem; line-height: .8; }
    .title .t { font-size: .85rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
    .title .t strong { display: block; font-family: var(--serif); font-size: 1.7rem; letter-spacing: 0; text-transform: none; color: var(--cream); font-weight: 500; }
    .credit { color: var(--cream); font-size: 1rem; margin-top: .4rem; opacity: .85; }
    .qr { display: flex; align-items: center; gap: 1rem; background: rgba(14,12,10,.8); border: 1px solid var(--line); border-radius: 16px; padding: .8rem 1.1rem .8rem .8rem; }
    .qr img { width: 112px; height: 112px; border-radius: 8px; background: #fff; padding: 4px; }
    .qr p { margin: 0; font-size: .95rem; max-width: 12rem; line-height: 1.35; }
    .qr p strong { display: block; color: #60a5fa; font-family: var(--serif); font-size: 1.45rem; font-weight: 500; }

    .badge { position: fixed; top: 1.6rem; left: 50%; transform: translate(-50%, -150%); transition: transform .5s cubic-bezier(.2,.9,.3,1.2);
      background: linear-gradient(180deg, #3b82f6, #1d4ed8); color: #ffffff; font-weight: 700; padding: .55rem 1.2rem; border-radius: 999px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
    .badge.on { transform: translate(-50%, 0); }

    .controls { position: fixed; top: 1rem; right: 1rem; display: flex; gap: .5rem; opacity: 0; transition: opacity .3s; }
    body.ui .controls { opacity: 1; }
    .waiting { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 2rem; }
    .waiting h1 { font-family: var(--serif); font-weight: 500; font-size: clamp(2.5rem, 6vw, 5rem); margin: 0 0 1rem; }
    .waiting .big-qr { width: min(46vh, 340px); background: #fff; padding: 10px; border-radius: 14px; margin: 1.5rem auto 0; }
  </style>
</head>
<body>
  <div class="stage" id="stage"></div>

  <div class="waiting hidden" id="waiting">
    <div>
      <p class="eyebrow">Gala · 50 anos</p>
      <h1>As fotografias da noite<br /><span class="gold-text">aparecem aqui</span></h1>
      <p style="color:var(--muted)">Aponte a câmara do telemóvel ao código e partilhe as suas.</p>
      <img class="big-qr" src="qr.svg" alt="QR-Code para enviar fotografias" />
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div>
      <div class="title">
        <span class="n gold-text">50</span>
        <span class="t">Gala<strong>Escola Prof. Reynaldo dos Santos</strong></span>
      </div>
      <div class="credit" id="credit"></div>
    </div>
    <div class="qr">
      <img src="qr.svg" alt="QR-Code para enviar fotografias" />
      <p><strong>Partilhe as suas fotos</strong>Aponte a câmara e envie. Aparecem aqui em segundos.</p>
    </div>
  </div>

  <div class="badge" id="badge">✦ Nova fotografia</div>

  <div class="controls">
    <button class="lb-btn" id="prev" aria-label="Anterior">‹</button>
    <button class="lb-btn" id="pause" aria-label="Pausa">❚❚</button>
    <button class="lb-btn" id="next" aria-label="Seguinte">›</button>
    <button class="lb-btn" id="fs" aria-label="Ecrã inteiro">⛶</button>
    <a class="lb-btn" href="index.html" aria-label="Sair" style="display:grid;place-items:center;text-decoration:none">✕</a>
  </div>

  <script src="common.js"></script>
  <script>
    const DURATION = 7000;
    const POLL = 8000;
    const params = new URLSearchParams(location.search);
    const duration = (Number(params.get("s")) || DURATION / 1000) * 1000;

    const stage = document.getElementById("stage");
    const waiting = document.getElementById("waiting");
    const overlay = document.getElementById("overlay");
    const credit = document.getElementById("credit");
    const badge = document.getElementById("badge");

    let photos = [];       // todas as fotografias aprovadas (mais recentes primeiro)
    let priority = [];     // novas fotografias a mostrar a seguir
    let index = -1;
    let currentId = null;
    let maxId = 0;
    let timer = null;
    let paused = false;

    function preload(src) {
      return new Promise((resolve) => { const i = new Image(); i.onload = i.onerror = () => resolve(); i.src = src; });
    }

    async function show(photo, isNew) {
      await preload(photo.url);
      const slide = document.createElement("div");
      slide.className = "slide";
      slide.innerHTML = `<div class="bg" style="background-image:url('${photo.thumb}')"></div><img src="${photo.url}" alt="" />`;
      stage.append(slide);
      requestAnimationFrame(() => requestAnimationFrame(() => slide.classList.add("show")));
      const old = [...stage.children].slice(0, -1);
      setTimeout(() => old.forEach((el) => el.remove()), 1600);
      currentId = photo.id;
      credit.textContent = [photo.uploader ? `📷 ${photo.uploader}` : "", Gala.timeAgo(photo.createdAt)].filter(Boolean).join(" · ");
      if (isNew) { badge.classList.add("on"); setTimeout(() => badge.classList.remove("on"), 4000); }
    }

    function next(step = 1) {
      clearTimeout(timer);
      if (!photos.length) return;
      let photo, isNew = false;
      if (step > 0 && priority.length) {
        photo = priority.shift();
        isNew = true;
        index = photos.findIndex((p) => p.id === photo.id);
      } else {
        index = (index + step + photos.length) % photos.length;
        photo = photos[index];
      }
      show(photo, isNew).then(schedule);
    }

    function schedule() {
      clearTimeout(timer);
      if (!paused) timer = setTimeout(() => next(1), duration);
    }

    function setWaiting() {
      const empty = photos.length === 0;
      waiting.classList.toggle("hidden", !empty);
      overlay.classList.toggle("hidden", empty);
    }

    async function poll() {
      try {
        const latest = await Gala.fetchPhotos();
        const wasEmpty = photos.length === 0;
        const fresh = latest.filter((p) => p.id > maxId);
        if (!wasEmpty) priority.push(...fresh.reverse());
        const keep = new Set(latest.map((p) => p.id));
        priority = priority.filter((p) => keep.has(p.id));
        photos = latest;
        maxId = Math.max(maxId, ...latest.map((p) => p.id), 0);
        setWaiting();
        if (currentId && !keep.has(currentId)) { stage.replaceChildren(); next(1); }
        else if (wasEmpty && photos.length) next(1);
        else if (!photos.length) stage.replaceChildren();
      } catch {}
    }

    // Controlos (aparecem ao mexer o rato)
    let uiTimer;
    document.addEventListener("mousemove", () => {
      document.body.classList.add("ui");
      clearTimeout(uiTimer);
      uiTimer = setTimeout(() => document.body.classList.remove("ui"), 2500);
    });
    const pauseBtn = document.getElementById("pause");
    function togglePause() {
      paused = !paused;
      pauseBtn.textContent = paused ? "▶" : "❚❚";
      paused ? clearTimeout(timer) : schedule();
    }
    pauseBtn.onclick = togglePause;
    document.getElementById("next").onclick = () => next(1);
    document.getElementById("prev").onclick = () => next(-1);
    document.getElementById("fs").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") next(1);
      if (e.key === "ArrowLeft") next(-1);
      if (e.key === " ") { e.preventDefault(); togglePause(); }
      if (e.key.toLowerCase() === "f") document.getElementById("fs").click();
    });

    // Evita que o ecrã se apague durante a apresentação
    if ("wakeLock" in navigator) {
      const lock = () => navigator.wakeLock.request("screen").catch(() => {});
      lock();
      document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && lock());
    }

    poll();
    setInterval(poll, POLL);
  </script>
</body>
</html>
